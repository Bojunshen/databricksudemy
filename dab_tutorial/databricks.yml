# This is a Declarative Automation Bundle definition for dab_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_tutorial
  uuid: b3376be7-fad6-4346-a4d7-ae015564aa0e

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: dbc-7fa54e95-85c5.cloud.databricks.com
    variables:
      catalog: databricksesteban
      schema: ${workspace.current_user.short_name}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false

  prod:
    mode: production
    workspace:
      host: dbc-7fa54e95-85c5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jasonshen1272@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jasonshen1272@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: databricksesteban
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
